{
    "files": [
        "src/PairPoolManager.sol",
        "src/LendingPoolManager.sol",
        "src/MirrorTokenManager.sol",
        "src/MarginLiquidity.sol",
        "src/MarginHook.sol",
        "src/MarginFees.sol",
        "src/PoolStatusManager.sol",
        "certora/helpers/PoolManager.sol",
        "certora/helpers/Helper.sol",
        "certora/helpers/Fallback.sol"
    ],
    "link": [
        "MarginHook:pairPoolManager=PairPoolManager",
        "MarginHook:poolManager=PoolManager",
        "PairPoolManager:mirrorTokenManager=MirrorTokenManager",
        "PairPoolManager:marginLiquidity=MarginLiquidity",
        "PairPoolManager:lendingPoolManager=LendingPoolManager",
        "PairPoolManager:marginFees=MarginFees",
        "PairPoolManager:poolManager=PoolManager",
        "PairPoolManager:statusManager=PoolStatusManager",
        "PairPoolManager:hooks=MarginHook",
        "PoolStatusManager:poolManager=PoolManager",
        "PoolStatusManager:mirrorTokenManager=MirrorTokenManager",
        "PoolStatusManager:lendingPoolManager=LendingPoolManager",
        "PoolStatusManager:marginLiquidity=MarginLiquidity",
        "PoolStatusManager:pairPoolManager=PairPoolManager",
        "PoolStatusManager:marginFees=MarginFees",
        "LendingPoolManager:poolManager=PoolManager",
        "LendingPoolManager:mirrorTokenManager=MirrorTokenManager",
        "LendingPoolManager:pairPoolManager=PairPoolManager",
    ],
    "rule":[
        "depositEndsWithZeroVirtualAccounting",
        "withdrawEndsWithZeroVirtualAccounting",
        "balanceMirrorEndsWithZeroVirtualAccounting",
        "depositWithdrawsOthersBalance",
    ],
    "prover_args":[
        "-copyLoopUnroll 6",
        "-depth 7",
        "-s [z3:lia1,z3:lia2,cvc4,yices,z3:def]",
    ],
    "exclude_rule":["ValidStatusInitializedPools"],
    "optimistic_loop": false,
    "parametric_contracts":["LendingPoolManager"],
    "build_cache": true,
    "loop_iter": "2",
    "smt_timeout": "1200",
    "process": "emv",
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_via_ir": false,
    "server":"production",
    "verify": "LendingPoolManager:certora/spec/LendingPoolManager.spec",
    //"rule_sanity":"basic",
    "optimistic_fallback": true, // by recommendation from notifications tab
    "msg":"LendingPool Manager",
    "rule_sanity": "basic",
}